<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230B57D0'%3E%3Cpath d='M12 2L1 9l11 7 9-5.73V17h2V9L12 2z'/%3E%3Cpath d='M4.14 12.03L12 17l7.86-4.97L12 22l-7.86-9.97z'/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="SmartCampus JNTU-GV (CEV) Issue Reporting & Management System - Report maintenance, security, electrical, hostel, and cleaning issues with AI-assisted categorization." />
  <meta name="keywords"
    content="college complaint, grievance system, JNTU-GV SmartCampus, student grievance, issue tracker" />
  <title>SmartCampus JNTU-GV (CEV) Issue Reporting & Management System</title>

  <!-- Google Material 3 Fonts: Figtree (Google Sans alternative) & Roboto Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Immediate Theme Initializer to prevent flash on reload -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('smartcampus-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body
  class="bg-[var(--md-sys-color-background)] text-[var(--md-sys-color-on-background)] font-sans antialiased min-h-screen selection:bg-[var(--md-sys-color-primary-container)] selection:text-[var(--md-sys-color-on-primary-container)]">
  <div id="root" class="min-h-screen flex flex-col"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
